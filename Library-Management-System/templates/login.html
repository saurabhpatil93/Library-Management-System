<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body class="login-body">

    <div class="auth-container">

        <!-- LEFT SECTION -->

        <div class="auth-left">

            <h1>📖 Welcome Back</h1>

            <p>
                Login to continue managing books,
                members, issue records, and more.
            </p>

            <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">

        </div>

        <!-- RIGHT SECTION -->

        <div class="auth-right">

            <form method="POST">

                <h1>Login</h1>

                <input type="email"
                       name="email"
                       placeholder="Email Address"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">

                    Login

                </button>

                <a href="/">

                    Create New Account

                </a>

            </form>

        </div>

    </div>

</body>

</html>
