<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Issue Book</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

    <div class="navbar">

        <h2>📖 Issue Book</h2>

        <a href="/dashboard">
            Dashboard
        </a>

    </div>

    <div class="form-container">

        <h1>Issue Book</h1>

        <form method="POST">

            <input type="text"
                   name="member_name"
                   placeholder="Member Name"
                   required>

            <input type="text"
                   name="book_title"
                   placeholder="Book Title"
                   required>

            <button type="submit">

                Issue Book

            </button>

        </form>

    </div>

</body>

</html>
